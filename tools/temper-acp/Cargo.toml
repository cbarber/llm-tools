[package]
name = "temper-acp"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1.0"
clap = "4.5"
regex = "1.11"
sacp-conductor = "11.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tokio = { version = "1.47", features = ["io-std", "io-util", "macros", "process", "rt-multi-thread"] }

[[bin]]
name = "sacp-conductor"
path = "src/conductor.rs"

[dev-dependencies]
tempfile = "3.20"
